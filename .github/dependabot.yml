version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      slidev:
        patterns: ['@slidev/*', 'slidev-*']
    ignore:
      # astro check does not support TypeScript 7 yet. Remove this once it
      # does, then confirm with `pnpm check`.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
