name: Build and deploy

# Pull requests (including the content sync from the private knowledge
# repository) are built and checked. Pushes to main are also published to
# GitHub Pages (repository Settings > Pages > Source must be "GitHub
# Actions").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check decks and types
        run: pnpm check

      - name: Build site and decks
        run: pnpm build
        env:
          # The public address, fixed and always https. Canonical URLs, the
          # sitemap, robots.txt, the feed and preview images are built from it.
          SITE_URL: https://cychiang.github.io
          BASE_PATH: /
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
