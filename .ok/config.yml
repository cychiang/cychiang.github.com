# OpenKnowledge project settings (https://openknowledge.ai/docs/reference/configuration).
# Committed, so every clone opens the same way. Machine-local settings such
# as the sync mode live in .ok/local/, which git ignores.

# The whole repository is the project; .okignore hides everything that is not
# content, so the editor shows only decks/ and posts/.
content:
  dir: "."
  attachmentFolderPath: "./"

# Frontmatter is checked in the editor with the same rules `pnpm check` uses.
contentRules:
  frontmatter:
    enabled: true
    schemas:
      - file: .ok/schemas/post.json
        appliesTo: "posts/**/*.md"
      - file: .ok/schemas/about.json
        appliesTo: "about/*.md"
      - file: .ok/schemas/deck.json
        appliesTo: "decks/*/slides.md"
  okf:
    enabled: true
  markdownlint:
    enabled: false

validation:
  links: error

# Content is written in the private repository cychiang/knowledge, which
# keeps a copy of this config and the schemas (see AGENTS.md, "Where content
# comes from"). This copy is the source when the rules change.
autoSync:
  default: full
